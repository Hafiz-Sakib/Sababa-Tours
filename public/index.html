<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFDFD" />
    <meta name="description" content="Sababa Tours - tour packages, guides and bookings across Bangladesh" />

    <!-- icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sababa Tours" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Sababa Tours" />
    <meta name="format-detection" content="telephone=no" />

    <!-- social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sababa Tours" />
    <meta property="og:title" content="Sababa Tours" />
    <meta property="og:description" content="Tour packages, guides and bookings across Bangladesh" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Sababa Tours</title>
    <!-- apply the saved (or system) theme before first paint: no flash -->
    <script>try{var t=localStorage.getItem("sababa-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches)){var d=document.documentElement;d.classList.add("dark");d.style.colorScheme="dark";document.querySelector('meta[name="theme-color"]').setAttribute("content","#080E18")}}catch(e){}</script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
