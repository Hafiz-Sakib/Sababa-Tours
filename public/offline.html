<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAFDFD" />
<title>Offline · Sababa Tours</title>
<style>
  :root{color-scheme:light dark;--bg:#FAFDFD;--ink:#101828;--muted:#546470;--brand:#1D8A84}
  @media (prefers-color-scheme:dark){:root{--bg:#080E18;--ink:#ECF6F4;--muted:#96AAB0;--brand:#52D0C6}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  img{width:min(220px,60vw);height:auto;margin:0 auto 24px;display:block}
  .n{display:none}
  @media (prefers-color-scheme:dark){.d{display:none}.n{display:block}}
  h1{font-size:clamp(1.5rem,5vw,2rem);margin:0 0 10px}
  p{margin:0 auto 24px;max-width:28rem;color:var(--muted);line-height:1.6}
  button{border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;padding:14px 32px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
  <img class="d" src="/logo-day.png" alt="Sababa Tours" />
  <img class="n" src="/logo-night.png" alt="Sababa Tours" />
  <h1>You are offline</h1>
  <p>Looks like the connection dropped. Pages you have already opened still work – reconnect to browse new packages and make bookings.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
